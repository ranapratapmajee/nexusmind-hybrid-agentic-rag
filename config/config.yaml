# config/config.yaml

app:
  name: "NexusResearch"
  bot_name: "Nexa"
  description: "Hybrid Research Assistant with ChromaDB, Neo4j, Web Search, Gemini and Local LLM."
  version: "0.1.0"

# ============================================================
# Vector Store Engine Definitions
# ============================================================
chroma:
  host: "${CHROMA_HOST}"
  port: ${CHROMA_PORT}
  collection_name: "${CHROMA_COLLECTION}"

# ============================================================
# Knowledge Graph Network Definitions
# ============================================================
neo4j:
  uri: "${NEO4J_URI}"
  username: "${NEO4J_USERNAME}"
  password: "${NEO4J_PASSWORD}"
  database: "${NEO4J_DATABASE}"

# ============================================================
# Local Compute Hardware Engine Setup (Ollama Engine)
# ============================================================
local_llm:
  base_url: "${OLLAMA_BASE_URL}"
  model: "${OLLAMA_MODEL}"

# ============================================================
# Cloud Framework Fallback Systems
# ============================================================
gemini:
  api_key_env: "GOOGLE_API_KEY"
  model: "${GEMINI_MODEL}"

# ============================================================
# Retrieval & Document Processing Tuners
# ============================================================
research:
  top_k_vector_results: 5
  top_k_graph_results: 5
  max_web_results: 5

rag:
  chunk_size: 500
  chunk_overlap: 50
  embedding_model: "${EMBEDDING_MODEL}"

paths:
  data_dir: "${DATA_DIR}"

logging:
  level: "${LOG_LEVEL}"
