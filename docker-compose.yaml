version: '3.8'

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: chromadb_container
    ports:
      - "8000:8000"
    volumes:
      - ./storage/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: neo4j_container
    ports:
      - "7474:7474" # Browser Dashboard
      - "7687:7687" # Bolt Connection Port
    volumes:
      - ./storage/neo4j/data:/data
      - ./storage/neo4j/logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/rana1234
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
      - NEO4J_PLUGINS=["apoc"] # Essential for advanced GraphRAG calculations
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0'
    restart: unless-stopped
